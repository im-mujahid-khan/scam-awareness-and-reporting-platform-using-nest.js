version: "3.9"

services:
  backend:
    build: .
    container_name: scam-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7
    container_name: scam-redis
    ports:
      - "6379:6379"
    restart: always
